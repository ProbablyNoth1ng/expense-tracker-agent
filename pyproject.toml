[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monobank-expense-agent"
version = "0.1.0"
description = "Controlled LangGraph agent for reviewing Monobank expenses before writing to Google Sheets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.170,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.6,<2",
  "openai>=1.100,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
expense-agent = "expense_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["expense_agent"]
